name: Generate Neon Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShubhamY90
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff1744&color_dots=#0d1117,#1a1a1a,#2d2d2d,#3d3d3d,#4d4d4d
            dist/snake-light.svg?palette=github-light
      - name: Add glow effect to dark mode snake
        run: |
          python3 << 'EOF'
          with open('dist/snake-dark.svg', 'r') as f:
              content = f.read()
          content = content.replace('<svg', '<svg style="filter: drop-shadow(0 0 10px #ff1744) drop-shadow(0 0 20px #ff1744) drop-shadow(0 0 30px #ff1744)"', 1)
          with open('dist/snake-dark.svg', 'w') as f:
              f.write(content)
          EOF
      - name: Push snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
