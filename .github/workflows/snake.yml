name: Generate Neon Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShubhamY90
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff1744&color_dots=#0d1117,#3d5a80,#5b7fa6,#79a8d3,#a0d2ff
            dist/snake-light.svg?palette=github-light&color_snake=#ff1744
      - name: Push snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
