name: Generate Cyber Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShubhamY90
          outputs: |
            dist/snake-dark.svg?palette=github-dark-dimmed&color_snake=#ff003c,#0066ff&color_dots=#161b22,#220011,#440022,#660033,#990044
            dist/snake-light.svg?palette=github-light

      - name: Push snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
